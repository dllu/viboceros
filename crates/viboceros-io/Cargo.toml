[package]
name = "viboceros-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native-smlib = ["dep:viboceros-smlib"]

[dependencies]
viboceros-opennurbs.workspace = true
monstertruck.workspace = true
num-rational.workspace = true
num-traits.workspace = true
tempfile = "3.27.0"
thiserror.workspace = true
uuid.workspace = true
viboceros-geometry.workspace = true
viboceros-smlib = { path = "../viboceros-smlib", optional = true, features = ["native"] }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "step_regions"
required-features = ["native-smlib"]
