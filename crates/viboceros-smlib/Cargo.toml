[package]
name = "viboceros-smlib"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native = ["dep:cmake", "dep:viboceros-geometry", "dep:thiserror", "dep:i_overlay"]

[dependencies]
viboceros-geometry = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
i_overlay = { workspace = true, optional = true }

[build-dependencies]
cmake = { version = "0.1.58", optional = true }

[dev-dependencies]
serde_json.workspace = true
viboceros-io.workspace = true
tempfile = "3.27.0"

[[example]]
name = "perforated_plate"
required-features = ["native"]

[[example]]
name = "reference"
required-features = ["native"]

[[example]]
name = "network_parameterization"
required-features = ["native"]

[[example]]
name = "network_family_parameterization"
required-features = ["native"]

[[example]]
name = "fitted_network"
required-features = ["native"]

[[example]]
name = "export_breps"
required-features = ["native"]

[[example]]
name = "fillet_edges"
required-features = ["native"]

[[example]]
name = "blend_surface"
required-features = ["native"]

[[example]]
name = "surface_fillets"
required-features = ["native"]
