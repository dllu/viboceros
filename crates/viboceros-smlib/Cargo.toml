[package]
name = "viboceros-smlib"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native = ["dep:cmake", "dep:viboceros-geometry", "dep:thiserror"]

[dependencies]
viboceros-geometry = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[build-dependencies]
cmake = { version = "0.1.58", optional = true }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "perforated_plate"
required-features = ["native"]

[[example]]
name = "reference"
required-features = ["native"]
